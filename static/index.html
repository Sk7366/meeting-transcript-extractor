<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Meeting Transcript Extractor</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --purple-50: #EEEDFE;
    --purple-200: #AFA9EC;
    --purple-600: #534AB7;
    --purple-800: #3C3489;
    --green-50: #EAF3DE;
    --green-600: #3B6D11;
    --blue-50: #E6F1FB;
    --blue-400: #378ADD;
    --amber-50: #FAEEDA;
    --amber-600: #854F0B;
    --gray-100: #D3D1C7;
    --text: #1a1a1a;
    --text-muted: #666;
    --border: rgba(0,0,0,0.12);
    --bg: #f5f5f2;
    --surface: #ffffff;
    --surface-2: #f9f9f7;
  }

  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    padding: 2rem 1rem;
  }

  .container { max-width: 820px; margin: 0 auto; }

  .header {
    display: flex; align-items: center; gap: 14px;
    margin-bottom: 2rem;
  }
  .logo {
    width: 42px; height: 42px; border-radius: 10px;
    background: var(--purple-600);
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0;
  }
  .logo svg { width: 22px; height: 22px; stroke: white; fill: none; stroke-width: 2; }
  .header-text h1 { font-size: 20px; font-weight: 600; }
  .header-text p { font-size: 13px; color: var(--text-muted); margin-top: 2px; }
  .badge {
    margin-left: auto; font-size: 11px; font-weight: 600;
    padding: 4px 10px; border-radius: 20px;
    background: var(--green-50); color: var(--green-600);
    white-space: nowrap;
  }

  .card {
    background: var(--surface);
    border: 0.5px solid var(--border);
    border-radius: 12px;
    padding: 1.25rem;
    margin-bottom: 1rem;
  }

  .card-label {
    font-size: 11px; font-weight: 600; color: var(--text-muted);
    text-transform: uppercase; letter-spacing: .05em;
    margin-bottom: 10px;
  }

  textarea {
    width: 100%;
    border: 0.5px solid var(--border);
    border-radius: 8px;
    padding: 12px;
    font-size: 14px;
    font-family: inherit;
    background: var(--surface-2);
    color: var(--text);
    resize: vertical;
    min-height: 130px;
    line-height: 1.6;
    transition: border-color .15s;
  }
  textarea:focus { outline: none; border-color: var(--purple-200); }

  .btn-row { display: flex; gap: 8px; margin-top: 12px; align-items: center; flex-wrap: wrap; }

  .btn-primary {
    padding: 9px 22px; border-radius: 8px;
    border: 0.5px solid var(--purple-200);
    background: var(--purple-50); color: var(--purple-800);
    font-size: 14px; font-weight: 500; cursor: pointer;
    transition: background .15s;
  }
  .btn-primary:hover { background: var(--purple-200); }
  .btn-primary:disabled { opacity: 0.5; cursor: not-allowed; }

  .examples { display: flex; gap: 6px; flex-wrap: wrap; }
  .chip {
    font-size: 12px; padding: 5px 12px; border-radius: 20px;
    border: 0.5px solid var(--border);
    background: var(--surface-2); color: var(--text-muted);
    cursor: pointer; transition: all .15s;
  }
  .chip:hover, .chip.active {
    background: var(--purple-50); border-color: var(--purple-200);
    color: var(--purple-800);
  }

  .status { display: flex; align-items: center; gap: 6px; margin-left: auto; font-size: 12px; color: var(--text-muted); }
  .dot { width: 7px; height: 7px; border-radius: 50%; background: #639922; }
  .dot.loading { background: var(--blue-400); animation: pulse 1s infinite; }
  .dot.error { background: #E24B4A; }
  @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.4} }

  .metrics {
    display: grid; grid-template-columns: repeat(3, 1fr);
    gap: 10px; margin-bottom: 1.25rem;
  }
  .metric {
    background: var(--surface-2); border-radius: 8px;
    padding: 14px; text-align: center;
  }
  .metric-val { font-size: 26px; font-weight: 600; color: var(--text); }
  .metric-lbl { font-size: 11px; color: var(--text-muted); margin-top: 3px; }

  .results-header {
    display: flex; align-items: center;
    justify-content: space-between; margin-bottom: 1rem;
  }
  .results-title { font-size: 15px; font-weight: 500; }
  .count-pill {
    font-size: 12px; padding: 4px 10px; border-radius: 20px;
    background: var(--green-50); color: var(--green-600); font-weight: 500;
  }

  .divider { height: 0.5px; background: var(--border); margin: 1rem 0; }

  .action-card {
    border: 0.5px solid var(--border); border-radius: 10px;
    padding: 13px 15px; margin-bottom: 8px;
    transition: border-color .15s;
  }
  .action-card:hover { border-color: var(--purple-200); }
  .action-card:last-child { margin-bottom: 0; }

  .ac-top { display: flex; align-items: flex-start; gap: 10px; }
  .ac-icon {
    width: 20px; height: 20px; border-radius: 50%;
    border: 0.5px solid var(--purple-200); background: var(--purple-50);
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0; margin-top: 1px;
  }
  .ac-icon svg { width: 10px; height: 10px; stroke: var(--purple-600); fill: none; stroke-width: 2.5; }
  .ac-desc { font-size: 14px; line-height: 1.5; flex: 1; }

  .ac-meta { display: flex; gap: 10px; margin-top: 9px; flex-wrap: wrap; }
  .meta-tag {
    display: flex; align-items: center; gap: 5px;
    font-size: 12px; color: var(--text-muted);
  }
  .meta-dot { width: 7px; height: 7px; border-radius: 50%; flex-shrink: 0; }
  .d-owner { background: var(--blue-400); }
  .d-date { background: #639922; }
  .d-status { background: var(--purple-200); }

  .no-deadline { opacity: 0.45; font-style: italic; }

  .json-toggle {
    font-size: 12px; color: var(--text-muted);
    cursor: pointer; display: flex; align-items: center; gap: 5px;
    user-select: none;
  }
  .json-toggle:hover { color: var(--text); }
  pre {
    background: var(--surface-2); border-radius: 8px;
    padding: 12px; font-size: 12px; color: var(--text-muted);
    line-height: 1.6; margin-top: 10px; overflow-x: auto;
    display: none;
  }

  .empty-state {
    text-align: center; padding: 2.5rem 1rem;
    color: var(--text-muted); font-size: 14px;
  }
  .empty-icon { font-size: 32px; margin-bottom: 10px; opacity: .5; }

  .error-msg {
    background: #FCEBEB; border: 0.5px solid #F09595;
    border-radius: 8px; padding: 12px; font-size: 13px; color: #A32D2D;
  }
</style>
</head>
<body>
<div class="container">

  <div class="header">
    <div class="logo">
      <svg viewBox="0 0 22 22"><rect x="3" y="3" width="16" height="16" rx="3"/><line x1="7" y1="8" x2="15" y2="8"/><line x1="7" y1="11" x2="12" y2="11"/><line x1="7" y1="14" x2="14" y2="14"/><circle cx="16" cy="14" r="4" fill="white" stroke="none"/><polyline points="14,14 15.5,15.5 18,13" stroke="#534AB7" stroke-width="2" fill="none" stroke-linecap="round"/></svg>
    </div>
    <div class="header-text">
      <h1>Meeting Transcript Extractor</h1>
      <p>AI-powered action item detection — Meta × HF Hackathon</p>
    </div>
    <div class="badge">Round 1 — 1.0</div>
  </div>

  <div class="card">
    <div class="card-label">Transcript input</div>
    <textarea id="transcript" placeholder="Paste your meeting transcript here…&#10;&#10;e.g. &quot;Alice: Bob, please prepare the Q1 budget by March 15th. Design team should finish wireframes this week.&quot;"></textarea>
    <div class="btn-row">
      <button class="btn-primary" id="extract-btn" onclick="runExtraction()">Extract actions</button>
      <div class="examples" id="chips">
        <div class="chip active" onclick="loadExample(0,this)">Easy</div>
        <div class="chip" onclick="loadExample(1,this)">Medium</div>
        <div class="chip" onclick="loadExample(2,this)">Hard</div>
      </div>
      <div class="status">
        <div class="dot" id="status-dot"></div>
        <span id="status-text">Ready</span>
      </div>
    </div>
  </div>

  <div class="card" id="results-card">
    <div id="results-inner">
      <div class="empty-state">
        <div class="empty-icon">📋</div>
        Paste a transcript above and click <strong>Extract actions</strong>
      </div>
    </div>
  </div>

</div>

<script>
const EXAMPLES = [
  `Alice: Before we wrap up — Bob, can you prepare the Q1 budget? It's due March 15th.
Bob: Got it. Design team, wireframes for the dashboard need to be done by end of week.`,

  `We need to optimize API endpoints before the sprint ends March 14. John, follow up on customer feedback by end of week. Sarah, iterate on the hero section. Mike, wrap up sprint planning.`,

  `Bob mentioned the Q1 budget thing needs someone to own it and it has to be done. The login situation keeps blocking engineering. Design knows what to do with those wireframes. Marketing has the launch deck on their radar for the review.`
];

function loadExample(i, el) {
  document.querySelectorAll('.chip').forEach(c => c.classList.remove('active'));
  el.classList.add('active');
  document.getElementById('transcript').value = EXAMPLES[i];
}

function setStatus(state, text) {
  const dot = document.getElementById('status-dot');
  const label = document.getElementById('status-text');
  dot.className = 'dot' + (state === 'loading' ? ' loading' : state === 'error' ? ' error' : '');
  label.textContent = text;
}

async function runExtraction() {
  const transcript = document.getElementById('transcript').value.trim();
  if (!transcript) return;

  const btn = document.getElementById('extract-btn');
  btn.disabled = true;
  setStatus('loading', 'Extracting…');

  try {
    const res = await fetch('/run', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ transcript })
    });

    if (!res.ok) throw new Error(`Server error: ${res.status}`);
    const data = await res.json();

    // Support both {tasks:[]} and direct array
    const actions = Array.isArray(data) ? data : (data.tasks || data.actions || []);
    renderResults(actions);
    setStatus('ok', `${actions.length} item${actions.length !== 1 ? 's' : ''} found`);
  } catch (err) {
    document.getElementById('results-inner').innerHTML =
      `<div class="error-msg">Error: ${err.message}. Check that the /run endpoint is running.</div>`;
    setStatus('error', 'Failed');
  } finally {
    btn.disabled = false;
  }
}

function renderResults(actions) {
  if (!actions.length) {
    document.getElementById('results-inner').innerHTML =
      '<div class="empty-state"><div class="empty-icon">🔍</div>No action items detected in this transcript.</div>';
    return;
  }

  const withOwner = actions.filter(a => a.owner).length;
  const withDeadline = actions.filter(a => a.deadline).length;

  let html = `
    <div class="results-header">
      <div class="results-title">Extracted action items</div>
      <div class="count-pill">${actions.length} item${actions.length !== 1 ? 's' : ''}</div>
    </div>
    <div class="metrics">
      <div class="metric"><div class="metric-val">${actions.length}</div><div class="metric-lbl">Actions</div></div>
      <div class="metric"><div class="metric-val">${withOwner}</div><div class="metric-lbl">Owners assigned</div></div>
      <div class="metric"><div class="metric-val">${withDeadline}</div><div class="metric-lbl">Deadlines found</div></div>
    </div>`;

  actions.forEach(a => {
    const deadlineHtml = a.deadline
      ? `<div class="meta-tag"><div class="meta-dot d-date"></div>${formatDate(a.deadline)}</div>`
      : `<div class="meta-tag no-deadline"><div class="meta-dot d-date"></div>No deadline</div>`;
    const ownerHtml = a.owner
      ? `<div class="meta-tag"><div class="meta-dot d-owner"></div>${a.owner}</div>`
      : '';

    html += `
      <div class="action-card">
        <div class="ac-top">
          <div class="ac-icon"><svg viewBox="0 0 10 10"><polyline points="2,5 4,7 8,3"/></svg></div>
          <div class="ac-desc">${escHtml(a.description)}</div>
        </div>
        <div class="ac-meta">
          ${ownerHtml}
          ${deadlineHtml}
          <div class="meta-tag"><div class="meta-dot d-status"></div>${a.status || 'pending'}</div>
        </div>
      </div>`;
  });

  html += `
    <div class="divider"></div>
    <div class="json-toggle" onclick="toggleJson(this)">
      <svg width="12" height="12" viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="2"><polyline points="4,3 7,6 4,9"/></svg>
      View raw JSON
    </div>
    <pre id="json-out">${escHtml(JSON.stringify(actions, null, 2))}</pre>`;

  document.getElementById('results-inner').innerHTML = html;
}

function toggleJson(el) {
  const pre = document.getElementById('json-out');
  const open = pre.style.display === 'block';
  pre.style.display = open ? 'none' : 'block';
  el.innerHTML = (open
    ? '<svg width="12" height="12" viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="2"><polyline points="4,3 7,6 4,9"/></svg>'
    : '<svg width="12" height="12" viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="2"><polyline points="3,4 6,7 9,4"/></svg>')
    + ' View raw JSON';
}

function formatDate(d) {
  if (!d) return '';
  try {
    return new Date(d + 'T12:00:00').toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });
  } catch { return d; }
}

function escHtml(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

// Load easy example on start
document.getElementById('transcript').value = EXAMPLES[0];
</script>
</body>
</html>
