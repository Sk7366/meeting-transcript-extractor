<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Meeting Transcript Extractor</title>

    <!-- Google Font -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;700&display=swap" rel="stylesheet">

    <style>
        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(135deg, #1e293b, #0f172a);
            color: white;
            margin: 0;
            padding: 0;
            text-align: center;
        }

        h1 {
            margin-top: 30px;
            font-size: 32px;
        }

        .container {
            max-width: 800px;
            margin: auto;
            padding: 20px;
        }

        textarea {
            width: 100%;
            height: 150px;
            border-radius: 10px;
            border: none;
            padding: 15px;
            font-size: 16px;
            margin-top: 20px;
        }

        button {
            margin-top: 15px;
            padding: 12px 25px;
            border: none;
            border-radius: 8px;
            background: #38bdf8;
            color: black;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background: #0ea5e9;
        }

        .results {
            margin-top: 30px;
            text-align: left;
        }

        .card {
            background: #1e293b;
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 10px;
            border-left: 5px solid #38bdf8;
        }

        .owner {
            font-weight: bold;
            color: #38bdf8;
        }

        .empty {
            margin-top: 20px;
            color: #94a3b8;
        }
    </style>
</head>

<body>

<div class="container">
    <h1>📊 Meeting Transcript Extractor</h1>
    <p>AI-powered action item detection — Meta × HF Hackathon</p>

    <textarea id="transcript" placeholder="Paste your meeting transcript here..."></textarea>
    
    <button onclick="extractActions()">Extract Actions</button>

    <div class="results" id="results"></div>
</div>

<script>
async function extractActions() {
    const transcript = document.getElementById("transcript").value;
    const resultsDiv = document.getElementById("results");

    resultsDiv.innerHTML = "⏳ Processing...";

    try {
        const response = await fetch("/run", {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify({ transcript })
        });

        const data = await response.json();

        if (data.actions && data.actions.length > 0) {
            resultsDiv.innerHTML = `<h3>✅ ${data.items_found} Action Items Found</h3>`;
            
            data.actions.forEach(item => {
                resultsDiv.innerHTML += `
                    <div class="card">
                        <div class="owner">👤 ${item.owner}</div>
                        <div>📝 ${item.description}</div>
                    </div>
                `;
            });

        } else {
            resultsDiv.innerHTML = `<div class="empty">🔍 No action items detected</div>`;
        }

    } catch (err) {
        resultsDiv.innerHTML = "❌ Error connecting to server";
    }
}
</script>

</body>
</html>
