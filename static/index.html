<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>AI Meeting Extractor</title>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;700&display=swap" rel="stylesheet">

<style>
body {
    margin: 0;
    font-family: 'Poppins', sans-serif;
    background: #0f172a;
    color: white;
    transition: 0.3s;
}

.light {
    background: #f1f5f9;
    color: black;
}

.header {
    text-align: center;
    padding: 20px;
    font-size: 26px;
    font-weight: bold;
}

.container {
    max-width: 900px;
    margin: auto;
    padding: 20px;
}

textarea {
    width: 100%;
    height: 140px;
    border-radius: 10px;
    padding: 10px;
}

button {
    margin: 10px 5px;
    padding: 10px 20px;
    border: none;
    border-radius: 8px;
    cursor: pointer;
}

.primary {
    background: #38bdf8;
}

.toggle {
    position: absolute;
    right: 20px;
    top: 20px;
}

.card {
    background: rgba(255,255,255,0.1);
    padding: 12px;
    margin-top: 10px;
    border-radius: 10px;
    animation: fade 0.5s;
}

.done {
    opacity: 0.5;
    text-decoration: line-through;
}

@keyframes fade {
    from {opacity:0}
    to {opacity:1}
}

.reasoning {
    font-size: 13px;
    color: gray;
    margin-top: 5px;
}
</style>
</head>

<body>

<button class="toggle" onclick="toggleTheme()">🌗</button>

<div class="header">🚀 AI Meeting Extractor</div>

<div class="container">

<textarea id="transcript" placeholder="Paste or speak your transcript..."></textarea><br>

<button class="primary" onclick="extract()">Generate Action Plan</button>
<button onclick="startVoice()">🎤 Speak</button>

<div id="result"></div>

<canvas id="chart" style="margin-top:30px;"></canvas>

</div>

<script>

let actionsData = [];

function toggleTheme() {
    document.body.classList.toggle("light");
}

function startVoice() {
    const recognition = new (window.SpeechRecognition || window.webkitSpeechRecognition)();
    recognition.start();
    recognition.onresult = function(event) {
        document.getElementById("transcript").value = event.results[0][0].transcript;
    }
}

// 🔥 EDIT FEATURES
function markDone(index) {
    actionsData[index].status = "completed";
    renderActions();
}

function updateOwner(index, value) {
    actionsData[index].owner = value;
}

function updateDeadline(index, value) {
    actionsData[index].deadline = value;
}

// 🔥 RENDER FUNCTION (NEW)
function renderActions() {
    const resDiv = document.getElementById("result");

    resDiv.innerHTML = `<h3>✅ ${actionsData.length} items</h3>`;

    let owners = {};

    actionsData.forEach((a, i) => {
        owners[a.owner] = (owners[a.owner] || 0) + a.confidence;

        resDiv.innerHTML += `
        <div class="card ${a.status === 'completed' ? 'done' : ''}">
            <b>👤 <input value="${a.owner}" onchange="updateOwner(${i}, this.value)"></b><br>
            
            📝 ${a.description}<br>

            📅 <input value="${a.deadline || ''}" placeholder="Set deadline"
                onchange="updateDeadline(${i}, this.value)"><br>

            🎯 ${a.confidence}

            <br><br>

            <button onclick="markDone(${i})">✅ Mark Done</button>

            <div class="reasoning">
                🤖 AI Reasoning: Identified action phrase + contextual mapping
            </div>
        </div>`;
    });

    // 🔥 Chart fix (confidence-based)
    if (window.myChart) window.myChart.destroy();

    const ctx = document.getElementById("chart").getContext("2d");

    window.myChart = new Chart(ctx, {
        type: 'bar',
        data: {
            labels: Object.keys(owners),
            datasets: [{
                label: 'Task Weight (Confidence)',
                data: Object.values(owners)
            }]
        }
    });
}

// 🔥 MAIN EXTRACT
async function extract() {
    const text = document.getElementById("transcript").value;
    const resDiv = document.getElementById("result");

    resDiv.innerHTML = "⏳ AI thinking...";

    const res = await fetch("/run", {
        method: "POST",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify({ transcript: text })
    });

    const data = await res.json();

    if (!data.actions || data.actions.length === 0) {
        resDiv.innerHTML = "❌ No actions found";
        return;
    }

    actionsData = data.actions;

    renderActions();
}
</script>

</body>
</html>
