<!DOCTYPE html>
<html>
<head>
    <title>Meeting Extractor</title>
    <style>
        body {
            background: #0f172a;
            color: white;
            font-family: Arial;
            text-align: center;
        }

        textarea {
            width: 80%;
            height: 120px;
            margin-top: 20px;
        }

        button {
            padding: 10px;
            margin-top: 10px;
        }

        .card {
            background: #1e293b;
            margin: 10px;
            padding: 10px;
            border-radius: 8px;
            animation: fadeIn 0.5s;
        }

        @keyframes fadeIn {
            from {opacity: 0;}
            to {opacity: 1;}
        }
    </style>
</head>

<body>

<h2>📊 Meeting Transcript Extractor</h2>

<textarea id="transcript"></textarea><br>
<button onclick="run()">Extract</button>

<div id="result"></div>

<script>
async function run() {
    const text = document.getElementById("transcript").value;
    const resDiv = document.getElementById("result");

    resDiv.innerHTML = "⏳ AI analyzing...";

    const res = await fetch("/run", {
        method: "POST",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify({ transcript: text })
    });

    const data = await res.json();

    if (data.actions.length === 0) {
        resDiv.innerHTML = "❌ No actions found";
        return;
    }

    resDiv.innerHTML = `<h3>✅ ${data.items_found} items found</h3>`;

    data.actions.forEach(a => {
        resDiv.innerHTML += `
        <div class="card">
            <b>👤 ${a.owner}</b><br>
            📝 ${a.description}<br>
            📅 ${a.deadline || "No deadline"}<br>
            🎯 Confidence: ${a.confidence}
        </div>`;
    });
}
</script>

</body>
</html>
