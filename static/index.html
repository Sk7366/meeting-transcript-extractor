<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>AI Meeting Extractor</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;700&display=swap" rel="stylesheet">

<style>
body {
    margin: 0;
    font-family: 'Poppins', sans-serif;
    background: linear-gradient(135deg, #0f172a, #1e293b);
    color: white;
}

/* HEADER */
.header {
    text-align: center;
    padding: 30px;
    font-size: 28px;
    font-weight: 700;
}

/* CONTAINER */
.container {
    max-width: 900px;
    margin: auto;
    padding: 20px;
}

/* INPUT BOX */
textarea {
    width: 100%;
    height: 150px;
    border-radius: 12px;
    border: none;
    padding: 15px;
    font-size: 15px;
    outline: none;
}

/* BUTTON */
button {
    margin-top: 15px;
    padding: 12px 25px;
    border: none;
    border-radius: 10px;
    background: linear-gradient(135deg, #38bdf8, #0ea5e9);
    color: black;
    font-weight: bold;
    cursor: pointer;
    transition: 0.3s;
}

button:hover {
    transform: scale(1.05);
}

/* RESULTS */
.results {
    margin-top: 30px;
}

/* CARD */
.card {
    background: rgba(255,255,255,0.05);
    backdrop-filter: blur(10px);
    border-radius: 12px;
    padding: 15px;
    margin-bottom: 12px;
    animation: slideUp 0.5s ease;
    border-left: 4px solid #38bdf8;
}

.owner {
    color: #38bdf8;
    font-weight: bold;
}

.confidence {
    color: #22c55e;
}

/* ANIMATION */
@keyframes slideUp {
    from {
        opacity: 0;
        transform: translateY(20px);
    }
    to {
        opacity: 1;
        transform: translateY(0);
    }
}

/* LOADER */
.loader {
    margin-top: 20px;
    font-size: 16px;
    color: #94a3b8;
}
</style>
</head>

<body>

<div class="header">
🚀 AI Meeting Transcript Extractor
</div>

<div class="container">

<textarea id="transcript" placeholder="Paste your meeting transcript here..."></textarea>

<button onclick="extractActions()">⚡ Extract Action Items</button>

<div class="results" id="results"></div>

</div>

<script>
async function extractActions() {
    const transcript = document.getElementById("transcript").value;
    const resultsDiv = document.getElementById("results");

    resultsDiv.innerHTML = `<div class="loader">⏳ AI is analyzing your meeting...</div>`;

    try {
        const response = await fetch("/run", {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify({ transcript })
        });

        const data = await response.json();

        if (!data.actions || data.actions.length === 0) {
            resultsDiv.innerHTML = `<div class="loader">🔍 No action items found</div>`;
            return;
        }

        resultsDiv.innerHTML = `<h3>✅ ${data.items_found} Action Items Found</h3>`;

        data.actions.forEach(item => {
            resultsDiv.innerHTML += `
                <div class="card">
                    <div class="owner">👤 ${item.owner}</div>
                    <div>📝 ${item.description}</div>
                    <div>📅 ${item.deadline || "No deadline"}</div>
                    <div class="confidence">🎯 Confidence: ${item.confidence}</div>
                </div>
            `;
        });

    } catch (error) {
        resultsDiv.innerHTML = `<div class="loader">❌ Server error</div>`;
    }
}
</script>

</body>
</html>
